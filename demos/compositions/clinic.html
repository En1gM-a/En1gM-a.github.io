  <script>
    ;(() => {
      const { seg, keys, typed, caret, camera } = kit
      const $ = (id) => document.getElementById(id)
      const show = (id, on) => ($(id).style.opacity = on ? "1" : "0")
      const CAM = [
        { t: 0, z: 1, x: 320, y: 182 },
        { t: 4.9, z: 1, x: 320, y: 182 },
        { t: 5.4, z: 1.22, x: 262, y: 149 },
        { t: 8.8, z: 1.22, x: 262, y: 149 },
        { t: 9.3, z: 1, x: 320, y: 182 },
      ]

      const tl = kit.run(10, (t) => {
        // The console clears between screens, as the app's Console.Clear() does
        const screen = t < 1.5 || t >= 9.4 ? "c-menu" : t < 3.45 ? "c-login" : t < 4.45 ? "c-doc" : "c-appt"
        for (const id of ["c-menu", "c-login", "c-doc", "c-appt"]) show(id, id === screen)

        // Main menu: the arrow keys move the highlight, Enter picks Login
        const sel = t < 0.5 || t >= 0.9 ? 0 : 1
        for (let i = 0; i < 3; i++) {
          const el = $(`c-m${i}`)
          el.className = i === sel ? "c-sel" : ""
          el.textContent = i === sel ? `  ► ${["Login", "Sign Up", "Exit"][i]} ◄  `.padEnd(15) : `    ${["Login", "Sign Up", "Exit"][i]}    `.padEnd(15)
        }

        // Login
        const user = typed("dr_reyes", t, 1.7, 18)
        $("c-user").textContent = user
        $("c-k1").style.opacity = String(t < 2.25 ? caret(t, user.length < 8) : 0)
        show("c-pl", t >= 2.3)
        $("c-pass").textContent = "*".repeat(Math.max(0, Math.min(8, Math.floor((t - 2.4) * 20))))
        $("c-k2").style.opacity = String(t >= 2.3 && t < 2.95 ? caret(t, t < 2.8) : 0)
        show("c-welcome", t >= 3.0)

        // Appointments: confirm number 1, then diagnose it
        show("c-l1", t >= 4.85)
        $("c-n1").textContent = t >= 5.0 ? "1" : ""
        show("c-l2", t >= 5.25)
        $("c-act").textContent = typed("CONFIRM", t, 5.4, 14)
        show("c-l3", t >= 6.2)
        const ok = t >= 6.4
        $("c-s1").textContent = ok ? "CONFIRMED" : "PENDING  "
        $("c-s1").className = ok ? "c-gr" : "c-ye"
        show("c-l4", t >= 6.8)
        $("c-n2").textContent = t >= 6.95 ? "1" : ""
        show("c-l5", t >= 7.15)
        $("c-dx").textContent = typed("Acute bronchitis", t, 7.25, 22)
        show("c-l6", t >= 8.3)
        $("c-k3").style.opacity = String(t >= 8.3 ? caret(t, false) : 0)

        const k = keys(CAM, t)
        $("c-cam").style.transform = camera(k.z, k.x, k.y, 640, 364)
      })
      window.__timelines = window.__timelines || {}
      window.__timelines["clinic"] = tl
    })()
  </script>
