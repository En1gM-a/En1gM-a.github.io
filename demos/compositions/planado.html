  <script>
    ;(() => {
      const { seg, ease, keys, typed, caret, press } = kit
      const $ = (id) => document.getElementById(id)

      // The month grid: November 2026 starts on a Sunday; dots are each day's events, coloured as the app does
      const DOTS = { 2: ["#4b82d0"], 3: ["#5b5ce2"], 5: ["#df823c"], 7: ["#d85b87", "#8a65c7"], 10: ["#4b82d0"], 12: ["#df823c"], 14: ["#5b5ce2"], 18: ["#d85b87"], 20: ["#4b82d0", "#df823c"], 25: ["#8a65c7"], 28: ["#5b5ce2"] }
      const CELL = 193.6 / 7
      const cell = (d) => ({ x: 12 + ((d - 1) % 7) * CELL, y: 112 + Math.floor((d - 1) / 7) * 24 })
      let html = ""
      for (let d = 1; d <= 30; d++) {
        const { x, y } = cell(d)
        const today = d === 3 ? "color: #fff; font-weight: 700" : ""
        const ring = d === 3 ? `<span class="p-abs" style="left: 4.8px; top: 1px; width: 18px; height: 18px; border-radius: 50%; background: #5b5ce2"></span>` : ""
        const dots = (DOTS[d] ?? []).map((c) => `<i style="background: ${c}"></i>`).join("")
        html += `<div class="p-cell" style="left: ${x}px; top: ${y}px">${ring}<span style="position: relative; ${today}">${d}</span><br />${dots}${d === 6 ? '<i id="p-newdot" style="background: #24966b"></i>' : ""}</div>`
      }
      $("p-grid").innerHTML = html
      const sel = cell(6)
      $("p-sel").style.left = `${sel.x + 1.8}px`
      $("p-sel").style.top = `${sel.y}px`

      // Taps: New event, the title, the location, Study, Important, Create event
      const TAPS = [
        { t: 2.0, x: 42, y: 184 },
        { t: 2.85, x: 100, y: 71 },
        { t: 3.65, x: 100, y: 115 },
        { t: 4.5, x: 32, y: 171 },
        { t: 4.95, x: 190, y: 216 },
        { t: 5.45, x: 109, y: 290 },
      ]
      const TITLE = "Study session"
      const LOC = "Library · 3F"
      const W = 217.6

      const tl = kit.run(10, (t) => {
        // Screens push in from the right like a native stack: home → new event → calendar; then home screen, then back
        const toCreate = ease.inOut(seg(t, 2.25, 2.65))
        const toCal = ease.inOut(seg(t, 5.65, 6.05))
        const toLaunch = ease.inOut(seg(t, 7.3, 7.85))
        const back = ease.inOut(seg(t, 9.25, 9.85))
        $("p-home").style.transform = `translateX(${-toCreate * W * 0.3}px)`
        $("p-home").style.opacity = String(toCreate < 1 ? 1 : back)
        $("p-create").style.transform = `translateX(${(1 - toCreate) * W - toCal * W * 0.3}px)`
        $("p-create").style.opacity = String(toCreate > 0 && toCal < 1 ? 1 : 0)
        $("p-cal").style.transform = `translateX(${(1 - toCal) * W}px) scale(${1 - 0.08 * toLaunch})`
        $("p-cal").style.opacity = String(toCal > 0 ? 1 - toLaunch : 0)
        $("p-launch").style.opacity = String(toLaunch * (1 - back))
        $("p-launch").style.transform = `scale(${1.06 - 0.06 * toLaunch})`

        // Typing the title and the location
        const title = typed(TITLE, t, 2.95, 22)
        $("p-title").textContent = title
        $("p-ph1").style.display = title ? "none" : ""
        $("p-c1").style.opacity = String(t > 2.85 && t < 3.65 ? caret(t, title.length < TITLE.length) : 0)
        $("p-f-title").style.borderColor = t > 2.85 && t < 3.65 ? "#5b5ce2" : "#e3e3f2"
        const loc = typed(LOC, t, 3.75, 22)
        $("p-loc").textContent = loc
        $("p-ph2").style.display = loc ? "none" : ""
        $("p-c2").style.opacity = String(t > 3.65 && t < 4.4 ? caret(t, loc.length < LOC.length) : 0)
        $("p-f-loc").style.borderColor = t > 3.65 && t < 4.4 ? "#5b5ce2" : "#e3e3f2"
        const study = t > 4.55
        $("p-study").style.background = study ? "#24966b" : "#fff"
        $("p-study").style.color = study ? "#fff" : "#23234d"
        $("p-study").style.borderColor = study ? "#24966b" : "#e3e3f2"
        const on = ease.out(seg(t, 5.0, 5.2))
        $("p-tog").style.background = on > 0.5 ? "#5b5ce2" : "#d9d9e8"
        $("p-knob").style.transform = `translateX(${13 * on}px)`
        $("p-create-btn").style.transform = `scale(${1 - 0.04 * press(t, 5.45)})`

        // The new event lands on Friday the 6th
        $("p-sel").style.opacity = String(ease.out(seg(t, 6.1, 6.4)))
        $("p-newdot").style.transform = `scale(${ease.back(seg(t, 6.15, 6.5)) * 1.4})`
        const ev = ease.out(seg(t, 6.35, 6.75))
        $("p-ev").style.opacity = String(ev)
        $("p-ev").style.transform = `translateY(${(1 - ev) * 8}px)`
        $("p-widget").style.transform = `scale(${0.9 + 0.1 * ease.back(seg(t, 7.7, 8.15))})`
        $("p-count").style.transform = `scale(${1 + 0.08 * Math.sin(Math.PI * seg(t, 8.3, 8.8))})`

        // The touch indicator, around each tap
        const tap = TAPS.reduce((best, k) => (Math.abs(t - k.t) < Math.abs(t - best.t) ? k : best))
        const near = Math.min(ease.out(seg(t, tap.t - 0.3, tap.t - 0.05)), 1 - ease.in(seg(t, tap.t + 0.15, tap.t + 0.4)))
        const moving = keys(TAPS.map((k) => ({ t: k.t - 0.08, x: k.x, y: k.y })), t)
        $("p-touch").style.opacity = String(near)
        $("p-touch").style.transform = `translate(${moving.x}px, ${moving.y}px) scale(${1 - 0.25 * press(t, tap.t)})`
      })
      window.__timelines = window.__timelines || {}
      window.__timelines["planado"] = tl
    })()
  </script>
