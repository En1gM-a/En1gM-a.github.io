  <script>
    ;(() => {
      const { seg, ease, keys, typed, caret, camera } = kit
      const $ = (id) => document.getElementById(id)
      const items = [...document.querySelectorAll("#m-col .m-item")]
      const lines = [...document.querySelectorAll("#m-col .m-line")]
      // What karl types, and when it is sent
      const INPUT = [
        { text: "/meeting start", from: 0.25, cps: 18, sent: 1.15 },
        { text: "I'll take the export bug", from: 2.75, cps: 48, sent: 3.3 },
        { text: "/meeting export", from: 5.15, cps: 30, sent: 6.45 },
      ]
      const CAM = [
        { t: 0, z: 1, x: 320, y: 200 },
        { t: 6.9, z: 1, x: 320, y: 200 },
        { t: 7.6, z: 1.45, x: 330, y: 300 },
        { t: 8.6, z: 1.45, x: 330, y: 300 },
        { t: 9.25, z: 1, x: 320, y: 200 },
      ]

      const tl = kit.run(10, (t) => {
        // Messages arrive at their times and fade away at the end, so the loop starts on the empty channel
        const keep = 1 - ease.in(seg(t, 9.3, 9.85))
        for (const el of items) {
          const at = +el.dataset.at
          el.style.display = t >= at && t < 9.9 ? "" : "none"
          const a = ease.out(seg(t, at, at + 0.25))
          el.style.opacity = String(a * keep)
          el.style.transform = `translateY(${(1 - a) * 6}px)`
        }
        for (const el of lines) el.style.opacity = String(ease.out(seg(t, +el.dataset.at, +el.dataset.at + 0.2)))

        // The input: typing, sending, and the command pickers above it
        const cur = INPUT.find((k) => t >= k.from && t < k.sent) ?? null
        const text = cur ? typed(cur.text, t, cur.from, cur.cps) : ""
        $("m-typed").textContent = text
        $("m-ph").style.display = text ? "none" : ""
        $("m-caret").style.opacity = String(cur ? caret(t, text.length < cur.text.length) : 0)
        const cmd = cur && cur.text.startsWith("/") && text.length > 0 && t < (cur.text.endsWith("export") ? 5.8 : cur.sent)
        $("m-pop").style.opacity = String(cmd ? 1 : 0)
        const pick = text.endsWith("export") || text.includes("ex") ? 3 : text.includes(" s") || text.endsWith("start") ? 0 : -1
        for (let i = 0; i < 4; i++) $(`m-r${i}`).style.background = i === pick ? "#404249" : "transparent"
        const fmt = t >= 5.8 && t < 6.45
        $("m-fmt").style.opacity = String(fmt ? 1 : 0)
        const opt = t < 6.05 ? 0 : t < 6.2 ? 1 : 2
        for (let i = 0; i < 3; i++) $(`m-o${i}`).style.background = fmt && i === opt ? "#404249" : "transparent"
        $("m-typing").style.opacity = String(t > 3.7 && t < 4.15 ? 1 : 0)

        const k = keys(CAM, t)
        $("m-cam").style.transform = camera(k.z, k.x, k.y, 640, 400)
      })
      window.__timelines = window.__timelines || {}
      window.__timelines["minutemeeting"] = tl
    })()
  </script>
