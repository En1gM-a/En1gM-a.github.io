            <div data-hf-id="hf-l8r3" class="w-box" id="w-pass" style="left: 330px; top: 168px; width: 230px; letter-spacing: 2px"><span data-hf-id="hf-vhri" id="w-p"></span></div>
            <div data-hf-id="hf-0ixh" class="w-abs" id="w-login-btn" style="left: 330px; top: 208px; width: 230px; height: 26px; background: #1e40af; color: #fff; font-size: 9px; font-weight: 700; text-align: center; line-height: 26px">Login</div>
            <div data-hf-id="hf-i3zj" class="w-abs" style="left: 362px; top: 246px; font-size: 8px; color: #475569">Dont have an account? <span data-hf-id="hf-4i3u" style="color: #2563eb; font-weight: 600">Sign Up</span></div>
          </div>

          <div data-hf-id="hf-vjwr" id="w-ring"></div>
          <svg data-hf-id="hf-4cg6" id="w-cursor" viewBox="0 0 14 20"><path data-hf-id="hf-vz16" d="M1 1v15.5l4-3.6 2.6 5.8 2.6-1.1-2.6-5.7h5.2Z" fill="#fff" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round" /></svg>
        </div>
      </div>
    </div>
  </div>
  <script>
    ;(() => {
      const { seg, ease, keys, typed, caret, press, ring, camera } = kit
      const $ = (id) => document.getElementById(id)
      const fuelRows = [...document.querySelectorAll(".w-fr")]
      const lines = [...document.querySelectorAll(".w-line")]
      lines.forEach((l) => { l.setAttribute("fill", "none"); l.setAttribute("stroke-width", "2"); l.setAttribute("stroke-linejoin", "round"); l.setAttribute("pathLength", "1"); l.setAttribute("stroke-dasharray", "1 1") })
      const APPROVE = { x: 150 + 16 + 380 + 16, y: 112 + 44 + 13 }
      const OK = { x: 150 + 128 + 172 + 24, y: 132 + 66 + 9 }
      const PATH = [
        { t: 0, x: 560, y: 330 },
        { t: 0.6, x: 380, y: 135 },
        { t: 1.35, x: 380, y: 135 },
        { t: 1.5, x: 384, y: 181 },
        { t: 1.8, x: 384, y: 181 },
        { t: 1.95, x: 446, y: 222 },
        { t: 2.4, x: 446, y: 222 },
        { t: 3.7, x: APPROVE.x, y: APPROVE.y },
        { t: 4.4, x: APPROVE.x, y: APPROVE.y },
        { t: 4.8, x: OK.x, y: OK.y },
        { t: 5.0, x: OK.x, y: OK.y },
        { t: 5.35, x: 72, y: 137 },
        { t: 5.6, x: 72, y: 137 },
        { t: 6.6, x: 470, y: 268 },
        { t: 9.2, x: 470, y: 268 },
        { t: 10, x: 560, y: 330 },
      ]
      const CLICKS = [0.65, 1.55, 2.05, 3.85, 4.9, 5.45]
      const CAM = [
        { t: 0, z: 1, x: 320, y: 182 },
        { t: 7.4, z: 1, x: 320, y: 182 },
        { t: 8.0, z: 1.35, x: 400, y: 262 },
        { t: 8.7, z: 1.35, x: 400, y: 262 },
        { t: 9.25, z: 1, x: 320, y: 182 },
      ]

      const tl = kit.run(10, (t) => {
        const loginOn = Math.max(1 - ease.out(seg(t, 2.1, 2.45)), ease.inOut(seg(t, 9.3, 9.85)))
        $("w-login").style.opacity = String(loginOn)
        const u = typed("gov.reviewer", t, 0.75, 22)
        $("w-u").textContent = u
        $("w-uc").style.opacity = String(t > 0.65 && t < 1.5 ? caret(t, u.length < 12) : 0)
        $("w-user").style.borderColor = t > 0.65 && t < 1.5 ? "#2563eb" : "#cbd5e1"
        $("w-p").textContent = "•".repeat(Math.max(0, Math.min(10, Math.floor((t - 1.6) * 30))))
        $("w-pass").style.borderColor = t > 1.55 && t < 2.05 ? "#2563eb" : "#cbd5e1"
        $("w-login-btn").style.background = press(t, 2.05) > 0 ? "#1e3a8a" : "#1e40af"

        // Home → (approve one) → Fuel Price Monitor
        const toFuel = ease.inOut(seg(t, 5.45, 5.75))
        $("w-home").style.opacity = String(1 - toFuel)
        $("w-fuel").style.opacity = String(toFuel)
        $("w-on").style.top = `${98 + 26 * ease.inOut(seg(t, 5.42, 5.62))}px`
        const c = ease.out(seg(t, 2.4, 3.2))
        const approved = t >= 3.9
        $("w-t0").textContent = String(Math.round(128 * c))
        $("w-t1").textContent = String(Math.round(86 * c) + (approved ? 1 : 0))
        $("w-t2").textContent = String(Math.round(31 * c) - (approved ? 1 : 0))
        $("w-t3").textContent = String(Math.round(11 * c))
        $("w-st").textContent = approved ? "Approved" : "Under review"
        $("w-st").style.background = approved ? "#dcfce7" : "#fef3c7"
        $("w-st").style.color = approved ? "#15803d" : "#b45309"
        $("w-row").style.background = `rgb(220 252 231 / ${0.8 * Math.sin(Math.PI * seg(t, 3.9, 4.6))})`
        $("w-approve").style.filter = press(t, 3.85) > 0 ? "brightness(0.85)" : "none"
        const msg = Math.min(ease.out(seg(t, 4.0, 4.15)), 1 - ease.in(seg(t, 4.92, 5.02)))
        $("w-msg").style.opacity = String(msg)
        $("w-msg").style.transform = `scale(${0.96 + 0.04 * msg})`
        $("w-ok").style.background = press(t, 4.9) > 0 ? "#bfd7ff" : "#e5efff"

        fuelRows.forEach((r, i) => (r.style.opacity = String(ease.out(seg(t, 5.7 + i * 0.12, 6.0 + i * 0.12)))))
        lines.forEach((l, i) => (l.style.strokeDashoffset = String(1 - ease.inOut(seg(t, 6.1 + i * 0.15, 7.3 + i * 0.15)))))

        const p = keys(PATH, t)
        const pr = Math.max(...CLICKS.map((a) => press(t, a)))
        $("w-cursor").style.transform = `translate(${p.x}px, ${p.y}px) scale(${1 - 0.18 * pr})`
        const r = CLICKS.map((a) => ring(t, a)).find((x) => x.o > 0) ?? { s: 0, o: 0 }
        $("w-ring").style.transform = `translate(${p.x}px, ${p.y}px) scale(${r.s})`
        $("w-ring").style.opacity = String(r.o)
        const k = keys(CAM, t)
        $("w-cam").style.transform = camera(k.z, k.x, k.y, 640, 364)
      })
      window.__timelines = window.__timelines || {}
      window.__timelines["pantawid"] = tl
    })()
  </script>
</template>
