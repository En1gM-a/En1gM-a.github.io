                  <div data-hf-id="hf-w47m" class="k-abs" style="left: 11px; top: 216px; width: 210px; padding: 8px; border-radius: 8px; background: #eff6ff; font-size: 6.5px; line-height: 1.5; color: #1e40af">

            <!-- The app's real sign-in screen -->
            <div data-hf-id="hf-cnwo" id="k-login"><img data-hf-id="hf-004m" src="assets/kuryentipid.webp" alt="" /></div>

            <div data-hf-id="hf-qirk" id="k-tip" class="k-abs" style="left: 224px; top: 160px; padding: 3px 6px; border-radius: 5px; background: #111827; color: #fff; font-size: 7px; font-weight: 600; white-space: nowrap">Jul · 251 kWh</div>

            <div data-hf-id="hf-fnf3" id="k-banner">
              <div data-hf-id="hf-lu65" class="dot"><i data-hf-id="hf-zeb8"></i></div>
              <div data-hf-id="hf-yeow"><b data-hf-id="hf-1xab">Backend paused</b><span data-hf-id="hf-xfsh">Kuryentipid's Supabase project is no longer running, so sign-in and data are offline. This demo is recreated from the app's code.</span></div>

            <div data-hf-id="hf-8hiv" id="k-ring"></div>
            <svg data-hf-id="hf-1vs2" id="k-cursor" viewBox="0 0 14 20"><path data-hf-id="hf-ummh" d="M1 1v15.5l4-3.6 2.6 5.8 2.6-1.1-2.6-5.7h5.2Z" fill="#111827" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" /></svg>

  <script>
    ;(() => {
      const { seg, mix, ease, tween, keys, press, ring, peso, camera } = kit
      const $ = (id) => document.getElementById(id)
      const cam = $("k-cam"), login = $("k-login"), dash = $("k-dash"), opt = $("k-opt")
      const cursor = $("k-cursor"), ringEl = $("k-ring"), on = $("k-on"), banner = $("k-banner"), veil = $("k-veil")
      const pts = [...document.querySelectorAll(".k-pt")], bars = [...document.querySelectorAll(".k-b")]
      const BARS = [46, 21, 12, 8]
      const H0 = 8, H1 = 5, X0 = 14, W = 220 // the aircon slider: hours, its track's left edge and width

      // Where the cursor is when: Sign In, the chart, Bill Optimizer, the aircon slider (dragged 8h → 5h), the results
      const PATH = [
        { t: 0, x: 600, y: 316 },
        { t: 1.05, x: 480, y: 262 },
        { t: 1.6, x: 480, y: 262 },
        { t: 2.55, x: 226, y: 186 },
        { t: 3.05, x: 226, y: 186 },
        { t: 3.5, x: 62, y: 111 },
        { t: 3.95, x: 62, y: 111 },
        { t: 4.6, x: 124 + X0 + (H0 / 24) * W + 14, y: 50 + 52 + 2 },
        { t: 4.85, x: 124 + X0 + (H0 / 24) * W + 14, y: 50 + 52 + 2 },
        { t: 5.85, x: 124 + X0 + (H1 / 24) * W + 14, y: 50 + 52 + 2 },
        { t: 6.1, x: 124 + X0 + (H1 / 24) * W + 14, y: 50 + 52 + 2 },
        { t: 6.9, x: 470, y: 150 },
        { t: 9.2, x: 470, y: 150 },
        { t: 10, x: 600, y: 316 },
      ]
      const CLICKS = [1.2, 3.75, 4.8]
      const CAM = [
        { t: 0, z: 1, x: 320, y: 174 },
        { t: 6.1, z: 1, x: 320, y: 174 },
        { t: 6.9, z: 1.45, x: 510, y: 165 },
        { t: 7.7, z: 1.45, x: 510, y: 165 },
        { t: 8.3, z: 1, x: 320, y: 174 },
      ]

      const tl = kit.run(10, (t) => {
        // Sign in → the dashboard → Bill Optimizer → offline → back to sign in
        const app = 1 - (seg(t, 1.35, 1.75) < 1 ? 1 - ease.out(seg(t, 1.35, 1.75)) : 0)
        login.style.opacity = String(Math.max(1 - ease.out(seg(t, 1.35, 1.75)), ease.inOut(seg(t, 9.35, 9.9))))
        const toOpt = ease.inOut(seg(t, 3.85, 4.15))
        dash.style.opacity = String(1 - toOpt)
        opt.style.opacity = String(toOpt)
        on.style.top = `${mix(48, 100, ease.inOut(seg(t, 3.8, 4.05)))}px`
        $("k-n0").style.color = toOpt < 0.5 ? "#2563eb" : "#6b7280"
        $("k-n2").style.color = toOpt >= 0.5 ? "#2563eb" : "#6b7280"
        $("k-n0").style.fontWeight = toOpt < 0.5 ? "600" : "500"
        $("k-n2").style.fontWeight = toOpt >= 0.5 ? "600" : "500"

        // The dashboard fills in: counters, the trend line, the consumer bars
        const c = ease.out(seg(t, 1.8, 2.9))
        $("k-v0").textContent = peso(2846 * c)
        $("k-v1").textContent = `${Math.round(214 * c)} kWh`
        $("k-v2").textContent = String(Math.round(8 * c))
        $("k-v3").textContent = peso(412 * c)
        const draw = ease.inOut(seg(t, 1.9, 3.1))
        $("k-line").style.strokeDashoffset = String(1 - draw)
        $("k-area").style.opacity = String(ease.out(seg(t, 2.6, 3.3)))
        // Each point shows as the line reaches it; hovering July shows its reading
        pts.forEach((p, i) => (p.style.opacity = String(kit.clamp((draw - i / 5) * 12))))
        const tip = kit.window(t, 2.6, 3.35, 0.15)
        $("k-tip").style.opacity = String(tip)
        $("k-tip").style.transform = `translate(-50%, ${(1 - tip) * 4}px)`
        bars.forEach((b, i) => (b.style.width = `${BARS[i] * 2 * ease.out(seg(t, 2.1 + i * 0.12, 2.9 + i * 0.12))}%`))

        // The aircon slider dragged from 8 to 5 hours a day; the projected bill follows it
        const drag = ease.inOut(seg(t, 4.85, 5.85))
        const hrs = mix(H0, H1, drag)
        $("k-thumb").style.left = `${(hrs / 24) * W}px`
        $("k-fill0").style.width = `${(hrs / 24) * 100}%`
        $("k-hrs").textContent = `${Math.round(hrs)} hrs/day`
        $("k-proj").textContent = peso(2846 - 445 * drag)
        $("k-save").textContent = peso(445 * drag)
        $("k-projbar").style.width = `${160 * (1 - 0.156 * drag)}px`

        // Offline: the app greys out under a notice
        const off = Math.min(ease.out(seg(t, 7.9, 8.4)), 1 - ease.in(seg(t, 9.35, 9.9)))
        veil.style.opacity = String(off)
        banner.style.opacity = String(off)
        banner.style.transform = `translateY(${(1 - off) * -16}px)`

        // Cursor, clicks and the camera
        const p = keys(PATH, t)
        const pr = Math.max(...CLICKS.map((a) => press(t, a)), t > 4.85 && t < 5.85 ? 0.6 : 0)
        cursor.style.transform = `translate(${p.x}px, ${p.y}px) scale(${1 - 0.18 * pr})`
        const r = CLICKS.map((a) => ring(t, a)).find((x) => x.o > 0) ?? { s: 0, o: 0 }
        ringEl.style.transform = `translate(${p.x}px, ${p.y}px) scale(${r.s})`
        ringEl.style.opacity = String(r.o)
        const k = keys(CAM, t)
        cam.style.transform = camera(k.z, k.x, k.y, 640, 348)
      })
      window.__timelines = window.__timelines || {}
      window.__timelines["kuryentipid"] = tl
    })()
  </script>
</template>
