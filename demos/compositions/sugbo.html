  <script>
    ;(() => {
      const { seg, mix, ease, keys, typed, caret, press, ring, camera } = kit
      const $ = (id) => document.getElementById(id)
      const BRIEF = "Heavy traffic on Osmeña Blvd until 8:30. Light rain after 3 PM, so bring an umbrella. Power is out in Talamban from 1 to 3 PM."
      const ALERT_AT = [1.0, 1.4, 1.8, 2.2]
      const MAP = { x: 252, y: 38 } // the map card's corner, to place things over its pins
      const PIN = { x: MAP.x + 190, y: MAP.y + 140 } // the Osmeña traffic pin
      const PATH = [
        { t: 0, x: 560, y: 318 },
        { t: 3.3, x: 560, y: 318 },
        { t: 4.3, x: PIN.x + 3, y: PIN.y + 2 },
        { t: 5.9, x: PIN.x + 3, y: PIN.y + 2 },
        { t: 6.6, x: 210, y: 158 },
        { t: 9.2, x: 210, y: 158 },
        { t: 10, x: 560, y: 318 },
      ]
      const CLICK = 6.75
      const CAM = [
        { t: 0, z: 1, x: 320, y: 174 },
        { t: 3.5, z: 1, x: 320, y: 174 },
        { t: 4.4, z: 1.55, x: PIN.x - 10, y: PIN.y + 8 },
        { t: 5.8, z: 1.55, x: PIN.x - 10, y: PIN.y + 8 },
        { t: 6.5, z: 1, x: 320, y: 174 },
      ]

      const tl = kit.run(10, (t) => {
        // Everything that happened fades back out at the end, so the loop starts clean
        const keep = 1 - ease.in(seg(t, 9.3, 9.9))

        const text = typed(BRIEF, t, 0.35, 52)
        $("s-brief").textContent = text
        $("s-brief").style.opacity = String(keep)
        $("s-caret").style.opacity = String(caret(t, text.length > 0 && text.length < BRIEF.length) * keep)
        $("s-src").style.opacity = String(ease.out(seg(t, 2.8, 3.2)) * keep)

        $("s-route").style.strokeDashoffset = String(1 - ease.inOut(seg(t, 0.6, 2.6)))
        $("s-route").style.opacity = String(keep)
        ALERT_AT.forEach((at, i) => {
          const a = ease.out(seg(t, at, at + 0.35))
          const row = $(`s-a${i}`)
          row.style.opacity = String(a * keep)
          row.style.transform = `translateX(${(1 - a) * -10}px)`
          const pin = $(`s-p${i}`)
          pin.style.opacity = String(a * keep)
          pin.style.transform = `scale(${ease.back(seg(t, at, at + 0.4))})`
          // Each pin pings once a second
          const ping = ((t - at) % 1.2) / 1.2
          pin.querySelector("u").style.transform = `scale(${t > at ? mix(0.4, 1.8, ping) : 0})`
          pin.querySelector("u").style.opacity = String(t > at ? 0.45 * (1 - ping) : 0)
        })

        // The leave time is worked out from the alerts
        const lt = seg(t, 2.6, 3.3)
        const mins = 6 * 60 + 48 + Math.round(24 * ease.out(lt))
        $("s-time").textContent = lt > 0 && keep > 0.02 ? `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, "0")} AM` : "--:--"
        $("s-time").style.textShadow = `0 0 ${12 * Math.sin(Math.PI * seg(t, 3.0, 3.8))}px rgb(253 230 138 / 0.8)`
        $("s-beat").style.opacity = String(ease.out(seg(t, 3.2, 3.6)) * keep)
        $("s-btn").style.background = `rgb(252 211 77 / ${0.18 + 0.25 * press(t, CLICK)})`

        // Hovering the traffic pin shows its delay; the reminder confirms
        const tip = kit.window(t, 4.35, 5.9, 0.2)
        $("s-tip").style.opacity = String(tip)
        $("s-tip").style.transform = `translate(${PIN.x - 64}px, ${PIN.y - 46 + (1 - tip) * 5}px)`
        const toast = Math.min(ease.out(seg(t, 6.85, 7.2)), 1 - ease.in(seg(t, 8.7, 9.1)))
        $("s-toast").style.opacity = String(toast)
        $("s-toast").style.transform = `translateY(${(1 - toast) * 10}px)`

        const p = keys(PATH, t)
        $("s-cursor").style.transform = `translate(${p.x}px, ${p.y}px) scale(${1 - 0.18 * press(t, CLICK)})`
        const r = ring(t, CLICK)
        $("s-ring").style.transform = `translate(${p.x}px, ${p.y}px) scale(${r.s})`
        $("s-ring").style.opacity = String(r.o)
        const k = keys(CAM, t)
        $("s-cam").style.transform = camera(k.z, k.x, k.y, 640, 348)
      })
      window.__timelines = window.__timelines || {}
      window.__timelines["sugbo"] = tl
    })()
  </script>
