<!doctype html>
<!--
  Project demos for the portfolio's project cards: one 10 s loop per project, back to back. Each scene draws
  its app's screen centred in this 1280x800 canvas at the shape of its card's frame; cut.mjs cuts the
  render into one clip per project (trimmed to its slot, cropped to its screen).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; background: #030409; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-0pzu" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1280" data-height="800">
      <div data-hf-id="hf-jimm" id="sugbo" data-composition-id="sugbo" data-composition-src="compositions/sugbo.html" data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="800"></div>
      <div data-hf-id="hf-1pht" id="kuryentipid" data-composition-id="kuryentipid" data-composition-src="compositions/kuryentipid.html" data-start="10" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="800"></div>
      <div data-hf-id="hf-ecf1" id="planado" data-composition-id="planado" data-composition-src="compositions/planado.html" data-start="20" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="800"></div>
      <div data-hf-id="hf-q5z6" id="minutemeeting" data-composition-id="minutemeeting" data-composition-src="compositions/minutemeeting.html" data-start="30" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="800"></div>
      <div data-hf-id="hf-uwuw" id="pantawid" data-composition-id="pantawid" data-composition-src="compositions/pantawid.html" data-start="40" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="800"></div>
      <div data-hf-id="hf-stvn" id="clinic" data-composition-id="clinic" data-composition-src="compositions/clinic.html" data-start="50" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="800"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {}
      window.__timelines["main"] = gsap.timeline({ paused: true })
    </script>
  </body>
</html>
